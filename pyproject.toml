[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cnl-aatmi-project"
version = "0.1.0"
description = "Modular movie SME pipeline for CNL"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.13",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "h5py>=3.11",
]

[tool.setuptools]
py-modules = ["config", "models"]
packages = ["data_io", "preprocessing"]

[tool.setuptools.package-dir]
"" = "."